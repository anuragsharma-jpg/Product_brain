<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Brain — ask the Dream11 docs</title>
<style>
  :root { --ink:#171A1C; --paper:#F6F7F4; --muted:#5A6367; --faint:#8A9194; --line:#D6DBD6; --accent:#1F6F78; --amber:#B3620A; --amberbg:#FFF4E0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:40px 20px 80px; }
  h1 { font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-weight:500; font-size:30px; letter-spacing:-.3px; margin:0; }
  .sub { color:var(--muted); margin:4px 0 26px; font-size:15px; }
  .status { font-size:13px; color:var(--muted); margin-bottom:14px; }
  .status.err { color:#9A3B00; }
  .keybox { border:1px solid var(--line); background:#fff; border-radius:6px; padding:14px 16px; margin-bottom:22px; }
  .keybox label { font-size:12px; color:var(--muted); display:block; margin-bottom:6px; }
  .keybox .row { display:flex; gap:8px; }
  .keybox p { font-size:12px; color:var(--faint); margin:8px 0 0; line-height:1.4; }
  input, textarea { width:100%; border:1px solid #C9CFC9; border-radius:5px; background:#fff; font-size:14px; padding:9px 11px; font-family:inherit; }
  textarea { font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-size:17px; line-height:1.45; resize:vertical; padding:12px 14px; }
  button { background:var(--accent); color:#fff; border:none; border-radius:4px; padding:9px 16px; font-size:14px; cursor:pointer; font-family:inherit; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .ask { display:flex; flex-direction:column; gap:10px; margin-bottom:26px; }
  .ask button { align-self:flex-end; }
  .gap { background:var(--amberbg); border-left:3px solid var(--amber); color:#5C3A0F; padding:10px 14px; font-size:14px; margin-bottom:14px; border-radius:0 4px 4px 0; }
  .answer { font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-size:19px; line-height:1.55; white-space:pre-wrap; margin-bottom:26px; }
  .answer a.cite { color:var(--accent); font-family:system-ui,sans-serif; font-size:13px; text-underline-offset:3px; padding:0 3px; }
  .sources { border-top:1px solid var(--line); padding-top:16px; }
  .sources > div.t { font-size:13px; color:var(--muted); margin-bottom:8px; }
  details { padding:8px 0; border-bottom:1px solid #E6E9E6; }
  details.dim { opacity:.55; }
  summary { list-style:none; cursor:pointer; display:flex; flex-direction:column; gap:2px; }
  summary::-webkit-details-marker { display:none; }
  .path { font-size:14px; }
  .meta { font-size:12px; color:var(--faint); }
  pre { white-space:pre-wrap; font-family:inherit; font-size:13px; line-height:1.5; color:#3A4245; background:#FBFBF9; padding:12px; border-radius:4px; margin:8px 0 0; max-height:320px; overflow:auto; }
  a.notion { font-size:12px; color:var(--accent); display:inline-block; margin-top:6px; }
  @media (max-width:560px) { .answer { font-size:17px; } }
</style>
</head>
<body>
<main>
  <h1>Product Brain</h1>
  <div class="sub">Ask the Dream11 product docs. Answers cite the section they came from.</div>
  <div id="status" class="status">Loading index…</div>

  <div class="keybox" id="keybox">
    <label for="key">Anthropic API key (kept only in this browser)</label>
    <div class="row">
      <input id="key" type="password" placeholder="sk-ant-…" autocomplete="off">
      <button id="savekey">Save</button>
    </div>
    <p>Get one at console.anthropic.com. It is stored in localStorage on this device and sent only to api.anthropic.com. Usage is billed to that key.</p>
  </div>

  <div class="ask">
    <textarea id="q" rows="2" placeholder="e.g. Does a Pro user see ads on their 12th join?"></textarea>
    <button id="ask" disabled>Ask</button>
  </div>

  <div id="out"></div>
</main>

<script>
/* ---------- retrieval: identical to build.py / eval/run.py ---------- */
const STOP = new Set("the a an is are do does can i my in on of for to what how when which who with and or be it its this that user users".split(" "));
const TOKEN_RE = /[a-z0-9][a-z0-9\-\.]*[a-z0-9]|[a-z0-9]/g;
const K1=1.2, B=0.75, PATH_BOOST=2.0;
function stem(t){ if(t.length<=3||t.startsWith("r-"))return t; for(const s of["ies","es","s","ing","ed"]){ if(t.endsWith(s)&&t.length-s.length>=3){ t=t.slice(0,-s.length)+(s==="ies"?"y":""); break; } } if(t.length>4&&t.endsWith("e"))t=t.slice(0,-1); return t; }
function tokenize(x){ return ((x.toLowerCase().replace(/₹/g," rupees ")).match(TOKEN_RE)||[]).map(stem); }
function expand(query,syn){ const q=query.toLowerCase(); let toks=tokenize(q).filter(t=>!STOP.has(t)); const phrases=Object.keys(syn).filter(p=>p.includes(" ")).sort((a,b)=>b.length-a.length); for(const p of phrases) if(q.includes(p)) toks=toks.concat(tokenize(syn[p])); for(const t of[...toks]) if(syn[t]) toks=toks.concat(tokenize(syn[t])); return toks; }
function retrieve(index,syn,query,k=6){ const {N,avgdl,df}=index.bm25; const qt=expand(query,syn); const idf=t=>{const n=df[t]||0; return Math.log(1+(N-n+0.5)/(n+0.5));}; const scored=index.chunks.map(c=>{ let s=0; const pt=new Set(tokenize(c.heading_path)); for(const t of qt){ const f=c.tf[t]||0; if(!f)continue; let w=idf(t)*(f*(K1+1))/(f+K1*(1-B+B*c.dl/avgdl)); if(pt.has(t))w*=PATH_BOOST; s+=w; } if((c.slug==="l0-rules"||c.slug==="l0-glossary")&&!["scope","open_questions"].includes(c.section_type)) s*=1.25; return [s,c]; }); scored.sort((a,b)=>b[0]-a[0]); return scored.filter(([s])=>s>0).slice(0,k).map(([s,c])=>({...c,score:s})); }

const SYSTEM = `You answer questions about Dream11's product using ONLY the supplied Product Brain excerpts.

Rules:
- Answer in 2–6 sentences of plain prose. No headers, no bullet lists unless the answer is genuinely a list.
- Cite every factual claim with the chunk id in square brackets, e.g. [c3f9a1b2c4]. Cite the most canonical source first: Layer 0 Cross-cutting Rules or Glossary if present.
- If a chunk mentions a rule ID like R-07, name it.
- If the excerpts explicitly say something is a GAP, not documented, unresolved or unsettled, say so plainly and name the owner if given. Do not fill the gap from general knowledge.
- If the excerpts do not contain the answer, reply exactly: "Not in the docs." followed by one sentence on which page would be the natural home for it.
- Never invent numbers, names, or behaviour not in the excerpts.`;

/* ---------- app ---------- */
let INDEX=null, SYN={};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function setStatus(msg,err){ $("status").textContent=msg; $("status").className="status"+(err?" err":""); }
function keyOk(){ return !!localStorage.getItem("anthropic_key"); }
function refreshUi(){ $("ask").disabled=!(INDEX&&keyOk()); $("keybox").style.display=keyOk()?"none":"block"; if(keyOk()&&INDEX) setStatus(`${INDEX.n_chunks} chunks from ${INDEX.built_from.length} pages · key saved (clear)`); }
$("status").addEventListener("click",e=>{ if(e.target===$("status")&&$("status").textContent.includes("(clear)")){ localStorage.removeItem("anthropic_key"); refreshUi(); setStatus("Key cleared. Enter a key to ask questions."); } });
$("savekey").onclick=()=>{ const k=$("key").value.trim(); if(!k.startsWith("sk-ant-")){ setStatus("That doesn't look like an Anthropic key (should start with sk-ant-).",true); return; } localStorage.setItem("anthropic_key",k); $("key").value=""; refreshUi(); };

(async()=>{
  try{
    const [i,s]=await Promise.all([fetch("index.json").then(r=>r.json()),fetch("synonyms.json").then(r=>r.json())]);
    INDEX=i; SYN=s; setStatus(`${i.n_chunks} chunks from ${i.built_from.length} pages`+(keyOk()?" · key saved (clear)":" · enter an API key to ask")); refreshUi();
  }catch(e){ setStatus("Couldn't load index.json — is it in the same folder as this page?",true); }
})();

$("q").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); ask(); } });
$("ask").onclick=ask;

async function ask(){
  const q=$("q").value.trim(); if(!q||!INDEX||!keyOk())return;
  $("ask").disabled=true; $("ask").textContent="Reading…"; $("out").innerHTML="";
  const hits=retrieve(INDEX,SYN,q,6);
  if(!hits.length){ render("Not in the docs. No Product Brain section matched the question.",[]); done(); return; }
  const excerpts=hits.map(h=>`<chunk id="${h.id}" page="${h.page}" path="${h.heading_path}"${h.rule_ids.length?` rules="${h.rule_ids.join(",")}"`:""}${h.has_gap?' gap="true"':""}>\n${h.text}\n</chunk>`).join("\n\n");
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{ method:"POST", headers:{ "Content-Type":"application/json", "x-api-key":localStorage.getItem("anthropic_key"), "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
      body:JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1000, system:SYSTEM, messages:[{role:"user",content:`Question: ${q}\n\nProduct Brain excerpts:\n${excerpts}`}] }) });
    const data=await r.json();
    if(data.error){ render(`The model call failed: ${data.error.message}. Retrieval below still shows what the docs say.`,hits); }
    else render((data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n"),hits);
  }catch(e){ render("The model call failed (network). Retrieval below still shows what the docs say.",hits); }
  done();
}
function done(){ $("ask").disabled=false; $("ask").textContent="Ask"; }

function render(answer,hits){
  const byId=Object.fromEntries(hits.map(h=>[h.id,h]));
  const cited=new Set((answer.match(/\[([a-f0-9]{10})\]/g)||[]).map(m=>m.slice(1,-1)));
  const gap=hits.filter(h=>h.has_gap&&cited.has(h.id));
  let html="";
  if(gap.length){ const o=gap[0].owner; html+=`<div class="gap">This touches something the docs mark as a gap or unresolved.${o&&o!=="unassigned"?` Owner to ask: ${esc(o)}.`:" No owner recorded."}</div>`; }
  const body=esc(answer).replace(/\[([a-f0-9]{10})\]/g,(m,id)=>{ const h=byId[id]; return h?`<a class="cite" href="${h.notion_url}" target="_blank" rel="noreferrer" title="${esc(h.heading_path)}">${esc(h.page.replace(/^L0\.\d\s/,""))}</a>`:m; });
  html+=`<div class="answer">${body}</div>`;
  if(hits.length){
    html+=`<div class="sources"><div class="t">Where this came from</div>`;
    for(const h of hits){
      html+=`<details class="${cited.has(h.id)?"":"dim"}"><summary><span class="path">${esc(h.heading_path)}</span><span class="meta">${cited.has(h.id)?"cited":"retrieved"}${h.rule_ids.length?` · ${h.rule_ids.join(", ")}`:""}${h.has_gap?" · flags a gap":""}</span></summary><pre>${esc(h.text.replace(/^\[.*?\]\n/,""))}</pre><a class="notion" href="${h.notion_url}" target="_blank" rel="noreferrer">Open in Notion</a></details>`;
    }
    html+=`</div>`;
  }
  $("out").innerHTML=html;
}
</script>
</body>
</html>
